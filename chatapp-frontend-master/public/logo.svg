<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <!-- Background Ambient Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0" />
    </radialGradient>

    <!-- Main Emerald Gradients -->
    <linearGradient id="emFacetTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="emFacetLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <linearGradient id="emFacetRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="emFacetBottom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>

    <linearGradient id="emFacetCenter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="45%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="tailGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="emeraldShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#10b981" flood-opacity="0.38" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#047857" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Soft Ambient Backdrop -->
  <circle cx="64" cy="62" r="58" fill="url(#ambientGlow)" />

  <!-- Main Gem + Chat Bubble Geometry -->
  <g filter="url(#emeraldShadow)">
    <!-- Chat Tail pointing bottom-left -->
    <path
      d="M 38 88 L 22 108 C 21 109.5 22.8 111 24.5 110 L 48 98 Z"
      fill="url(#tailGrad)"
    />

    <!-- Outer Emerald Facet Base -->
    <!-- Octagonal/Hexagonal brilliant step cut -->
    <!-- Top-Left Facet -->
    <polygon points="40,24 64,14 64,44 40,54" fill="url(#emFacetTop)" opacity="0.95" />
    <!-- Top-Right Facet -->
    <polygon points="64,14 88,24 88,54 64,44" fill="url(#emFacetRight)" opacity="0.9" />
    <!-- Far-Left Corner -->
    <polygon points="24,44 40,24 40,54 24,70" fill="url(#emFacetLeft)" />
    <!-- Far-Right Corner -->
    <polygon points="88,24 104,44 104,70 88,54" fill="url(#emFacetRight)" />
    <!-- Bottom-Left Facet -->
    <polygon points="24,70 40,54 40,84 32,96" fill="url(#emFacetBottom)" />
    <polygon points="40,54 64,64 64,96 40,84" fill="url(#emFacetLeft)" />
    <!-- Bottom-Right Facet -->
    <polygon points="88,54 104,70 96,96 88,84" fill="url(#emFacetBottom)" />
    <polygon points="64,64 88,54 88,84 64,96" fill="url(#emFacetRight)" />

    <!-- Center Brilliant Table (Hexagonal Table of the Emerald) -->
    <polygon
      points="40,54 64,44 88,54 88,74 64,84 40,74"
      fill="url(#emFacetCenter)"
    />

    <!-- Inner Speech Symbol / Spark of Dialogue inside Table -->
    <!-- Modern Chat Dots / Messaging Signal in crisp white with soft glow -->
    <g transform="translate(64, 64)">
      <circle cx="-14" cy="0" r="3.5" fill="#ffffff" opacity="0.95" />
      <circle cx="0" cy="0" r="4.5" fill="#ffffff" />
      <circle cx="14" cy="0" r="3.5" fill="#ffffff" opacity="0.95" />
    </g>

    <!-- Highlight Reflection Accents (Glass / Jewel Lustre) -->
    <polygon points="40,24 64,14 64,18 42,27" fill="#ffffff" opacity="0.6" />
    <polygon points="24,44 40,24 38,27 26,45" fill="#ffffff" opacity="0.45" />
    <line x1="41" y1="54" x2="63" y2="45" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.5" />
  </g>
</svg>
